<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator · AI 项目工作台 — 功能思维导图</title>
<style>
  :root{
    --ink:#1f242e; --ink2:#444b57; --ink3:#78818f; --line:#dfe3ea;
    --canvas:#eef0f4; --card:#ffffff;
    --green:#18a86b; --blue:#3578e5; --purple:#7c5cf0; --orange:#e8872e;
    --cyan:#0ea5b7; --red:#df5b63; --amber:#ca9a16; --teal:#0f9d8f;
    --indigo:#4f63c9; --pink:#d85793; --slate:#5d6b7a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--canvas);font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;color:var(--ink);}
  .topbar{
    position:sticky;top:0;z-index:30;background:rgba(238,240,244,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 28px;
  }
  .topbar h1{font-size:18px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:10px;}
  .topbar h1 .dot{width:10px;height:10px;border-radius:3px;background:var(--ink);}
  .topbar p{font-size:12.5px;color:var(--ink3);margin-top:4px;}
  .legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}

  .viewport{overflow:auto;padding:36px 30px 60px;}
  .board{position:relative;margin:0 auto;}
  svg.wires{position:absolute;inset:0;pointer-events:none;z-index:1;}
  .node{position:absolute;z-index:2;}

  .root-node{
    z-index:5;border-radius:18px;padding:18px 22px;background:var(--ink);color:#fff;
    box-shadow:0 14px 34px rgba(31,36,46,.28);text-align:center;
  }
  .root-node b{display:block;font-size:16px;letter-spacing:.02em;}
  .root-node span{display:block;font-size:11.5px;color:rgba(255,255,255,.72);margin-top:5px;line-height:1.5;}

  .d-node{
    border-radius:13px;padding:10px 14px;background:var(--card);
    box-shadow:0 3px 12px rgba(31,36,46,.08);border:1.5px solid var(--c);
    min-width:168px;
  }
  .d-node .t{font-size:13.5px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:7px;}
  .d-node .t .n{
    width:19px;height:19px;border-radius:6px;background:var(--c);color:#fff;font-size:11px;
    display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700;
  }
  .d-node .r{font-size:10.5px;color:var(--ink3);margin-top:4px;margin-left:26px;font-family:ui-monospace,Menlo,monospace;}

  .g-node{
    border-radius:10px;padding:8px 12px;background:color-mix(in srgb,var(--c) 9%,#fff);
    border:1px solid color-mix(in srgb,var(--c) 30%,#fff);
    font-size:12px;font-weight:700;color:var(--ink2);min-width:140px;
    display:flex;align-items:center;gap:7px;
  }
  .g-node .bar{width:4px;height:14px;border-radius:2px;background:var(--c);}

  .l-node{
    background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:9px 12px 10px;width:318px;
    box-shadow:0 2px 8px rgba(31,36,46,.05);
  }
  .l-node:hover{box-shadow:0 6px 18px rgba(31,36,46,.12);border-color:color-mix(in srgb,var(--c) 45%,#fff);}
  .l-node .lt{font-size:12.5px;font-weight:650;color:var(--ink);display:flex;gap:7px;align-items:baseline;}
  .l-node .lt::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:0 0 auto;transform:translateY(-1px);}
  .l-node .ld{font-size:11.5px;line-height:1.62;color:var(--ink2);margin-top:4px;margin-left:13px;}
  .l-node .ld code{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#f1f3f7;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink2);}
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="dot"></span>Creator · AI 项目工作台 — 功能思维导图</h1>
  <p>中心主题向左/右放射 16 条主分支，逐级展开至具体功能点；每个功能点下方直接说明它的作用与对应交互。全部节点默认展开，可横向 / 纵向滚动查看。</p>
  <div class="legend">
    <span><i style="background:var(--indigo)"></i>登录认证</span>
    <span><i style="background:var(--green)"></i>工作台 / 项目</span>
    <span><i style="background:var(--blue)"></i>任务 / 审批 / 技能 / 连接器</span>
    <span><i style="background:var(--cyan)"></i>知识 / 自动化 / 上下文</span>
    <span><i style="background:var(--purple)"></i>能力拓展 / 智能应用</span>
    <span><i style="background:var(--orange)"></i>案例库 / 审计</span>
    <span><i style="background:var(--slate)"></i>平台架构 / LLM 底座</span>
  </div>
</div>

<div class="viewport"><div class="board" id="board">
  <svg class="wires" id="wires"></svg>
</div></div>

/* ================= 布局渲染 ================= */
const W = {domain:172, group:150, leaf:318};
const GAP = {domain:26, group:16, leaf:9};
const ROOT_W = 188, ROOT_GAP = 56;

function countLines(text, perLine){ return Math.max(1, Math.ceil(text.length/perLine)); }

/* 测量子树高度：node.kind = domain / group / leaf */
function measure(node, kind){
  node.kind = kind;
  if(kind === 'leaf'){
    const descLines = countLines(node.d, 24);
    node.h = descLines*19 + 40;
    node.w = W.leaf;
    return;
  }
  const childKind = kind === 'domain' ? (node.children[0].children ? 'group' : 'leaf') : 'leaf';
  let h = 0;
  node.children.forEach((c, i)=>{
    measure(c, childKind);
    h += c.h + (i ? (childKind==='leaf' ? GAP.groupLeaf : GAP.group) : 0);
  });
  // domain 若直接包 leaf：间距用 leaf gap
  if(kind === 'domain' && childKind === 'leaf'){
    h = node.children.reduce((s,c,i)=> s + c.h + (i?GAP.leaf:0), 0);
  }
  node.h = Math.max(h, 46);
  node.w = kind === 'domain' ? W.domain : W.group;
}

/* 分配纵向位置：node.y = 盒子顶部 */
function layout(node, yTop, gap){
  node.y = yTop;
  if(!node.children) return;
  let cy = yTop;
  const childGap = node.kind === 'domain'
    ? (node.children[0].kind==='group' ? GAP.group : GAP.leaf)
    : GAP.leaf;
  node.children.forEach(c=>{ layout(c, cy, childGap); cy += c.h + childGap; });
  const first = node.children[0], last = node.children[node.children.length-1];
  node.centerY = (first.y + first.h/2 + last.y + last.h/2)/2;
}

const board = document.getElementById('board');
const wires = document.getElementById('wires');
const nodes = [];
const paths = [];

/* 每侧子树的层 x（盒子左缘，相对该侧根边缘 0） */
const xLayer = {domain:0, group:W.domain+54, leaf:W.domain+54+W.group+46};
const subtreeW = xLayer.leaf + W.leaf;

DATA.forEach(domain => measure(domain, 'domain'));
const rightDomains = DATA.filter(d=>d.side==='right');
const leftDomains  = DATA.filter(d=>d.side==='left');

function stackDomains(list){
  let y = 0;
  list.forEach((d,i)=>{ layout(d, y, 0); d.selfCenter = y + d.h/2; y += d.h + (i?GAP.domain:0); });
  return y - GAP.domain;
}
const rightH = stackDomains(rightDomains);
const leftH  = stackDomains(leftDomains);
const contentH = Math.max(rightH, leftH);
const ROOT_H = 96;
const boardH = contentH + 80;
const boardW = subtreeW*2 + ROOT_GAP*2 + ROOT_W;
board.style.width = boardW + 'px';
board.style.height = boardH + 'px';
wires.setAttribute('width', boardW);
wires.setAttribute('height', boardH);

const rootX = (boardW - ROOT_W)/2;
const rootY = boardH/2 - ROOT_H/2;
const rightBaseX = rootX + ROOT_W + ROOT_GAP;
const leftBaseX  = rootX - ROOT_GAP;   // 左子树右边界

function domainX(kind, side){
  if(side==='right') return rightBaseX + xLayer[kind];
  return leftBaseX - xLayer[kind];
}

function emitTree(domain, side){
  const dX = domainX('domain', side);
  domain.absX = dX; domain.absY = domain.y;
  // 主分支节点相对其子树垂直居中
  const domTop = boxCenterY(domain) - 24;
  nodes.push({kind:'domain', x: side==='right'? dX : dX-W.domain, y:domTop, w:W.domain, color:domain.color, t:domain.t, route:domain.route});
  (domain.children||[]).forEach(child=> emitChild(child, domain, side));
}

function boxCenterY(n){ return (n.centerY!==undefined ? n.centerY : n.y + n.h/2); }

function emitChild(child, parent, side){
  const cX = domainX(child.kind, side);
  child.absX = cX; child.absY = child.y;
  if(child.kind==='group'){
    const gTop = boxCenterY(child) - 17;
    nodes.push({kind:'group', x: side==='right'?cX:cX-W.group, y:gTop, w:W.group, color:parent.color, t:child.t});
  }
  else nodes.push({kind:'leaf', x: side==='right'?cX:cX-W.leaf, y:child.y, w:W.leaf, color:parent.color, t:child.t, d:child.d});
  (child.children||[]).forEach(gc=> emitChild(gc, child, side));
}

function wire(parent, child, side){
  const pCenterY = boxCenterY(parent), cCenterY = boxCenterY(child);
  const px = side==='right' ? parent.absX + parent.w : parent.absX;
  const cx = side==='right' ? child.absX : child.absX + child.w;
  const bend = 34;
  let d;
  if(side==='right'){
    d = `M ${px} ${pCenterY} C ${px+bend} ${pCenterY}, ${cx-bend} ${cCenterY}, ${cx} ${cCenterY}`;
  }else{
    d = `M ${px} ${pCenterY} C ${px-bend} ${pCenterY}, ${cx+bend} ${cCenterY}, ${cx} ${cCenterY}`;
  }
  paths.push({d, color: parent.color});
}

/* 收集节点与全部连线（根→域、域→功能点） */
function collectWires(domain, side){
  const dCenterY = boxCenterY(domain);
  const px = side==='right' ? rootX+ROOT_W : rootX;
  const cx = side==='right' ? domain.absX : domain.absX + W.domain;
  const py = rootY+ROOT_H/2, bend = 70;
  const dPath = side==='right'
    ? `M ${px} ${py} C ${px+bend} ${py}, ${cx-bend} ${dCenterY}, ${cx} ${dCenterY}`
    : `M ${px} ${py} C ${px-bend} ${py}, ${cx+bend} ${dCenterY}, ${cx} ${dCenterY}`;
  paths.push({d:dPath, color:domain.color, root:true});
  (domain.children||[]).forEach(c=>{
    wire(domain, c, side);
    (c.children||[]).forEach(gc=> wire(c, gc, side));
  });
}
rightDomains.forEach(d=>{emitTree(d,'right'); collectWires(d,'right');});
leftDomains.forEach(d=>{emitTree(d,'left'); collectWires(d,'left');});

/* 画线 */
paths.forEach(p=>{
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', p.d);
  path.setAttribute('fill','none');
  path.setAttribute('stroke', p.color);
  path.setAttribute('stroke-width', p.root ? '2.4' : '1.5');
  path.setAttribute('stroke-opacity', p.root ? '0.9' : '0.55');
  wires.appendChild(path);
});

/* 画节点 */
const rootEl = document.createElement('div');
rootEl.className = 'node root-node';
rootEl.style.left = rootX+'px';
rootEl.style.top = rootY+'px';
rootEl.style.width = ROOT_W+'px';
rootEl.style.height = ROOT_H+'px';
rootEl.innerHTML = '<b>Creator AI 项目工作台</b><span>企业级 Agent 平台<br>前后端分离 · 项目即授权边界<br>三模式协作 · 全程可审计</span>';
board.appendChild(rootEl);

let n1=0;
nodes.forEach(n=>{
  const el = document.createElement('div');
  el.className = 'node ' + (n.kind==='domain'?'d-node':n.kind==='group'?'g-node':'l-node');
  el.style.left = n.x+'px';
  el.style.top = n.y+'px';
  el.style.width = n.w+'px';
  el.style.setProperty('--c', n.color);
  if(n.kind==='domain'){
    n1++;
    el.innerHTML = `<div class="t"><span class="n">${n1}</span>${n.t}</div><div class="r">${n.route||''}</div>`;
  }else if(n.kind==='group'){
    el.innerHTML = `<span class="bar"></span>${n.t}`;
  }else{
    el.innerHTML = `<div class="lt">${n.t}</div><div class="ld">${linkify(n.d)}</div>`;
  }
  board.appendChild(el);
});

/* 描述文本中的接口/技术词做等宽高亮 */
function linkify(text){
  return text
    .replace(/(POST|GET|PATCH|DELETE)\s+(\/[a-zA-Z0-9\/:_\-*]+)/g, '<code>$1 $2</code>')
    .replace(/(demo:true|res\.on\([^)]*\)|localStorage|projectId|skillIds|connectorIds|dedupKey|SSE|LLM|JSON|Bearer|toolName|skill\.cx_\*|plan_only|kb_answer|http_call|requireAuth|scrypt|tool\.test|ALLOWED_ORIGINS|CAPABILITY_MODEL\.md|\{ok,demo,data,error,sources\})/g, '<code>$1</code>');
}
</script>
